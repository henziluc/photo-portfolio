            </figure>

            <figure>
            
                <img src="images/village.jpeg" alt="Village">
            
                <figcaption>Village</figcaption>
            
            </figure>
                
        </div>
    
    </section>

    <div id="lightbox" class="lightbox">
    
        <span id="close">&times;</span>
    
        <img id="lightbox-image">
    
    </div>

    <script src="script.js"></script>

</body>

</html>
