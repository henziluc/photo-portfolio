<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal Photography</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div id="navbar"></div>

<header class="page-header">

    <h1>Landscape Photography</h1>

    <p>

        Mountains, lakes, forests and the beauty
        of nature from around the world.

    </p>

</header>

<section class="gallery">

    <div class="gallery-grid" id="gallery">

        

    </div>

</section>

<div id="footer"></div>

<div id="lightbox" class="lightbox">

    <button id="previous" class="lightbox-button">
        ←
    </button>

    <img id="lightbox-image" alt="Large Image">
    
    <p id="lightbox-title"></p>

    <p id="image-counter"></p>

    <button id="next" class="lightbox-button">
        →
    </button>

    <button id="close" class="close-button">
        ✕
    </button>

</div>

<script src="../js/gallery.js"></script>

<script src="../js/components.js"></script>

</body>

</html>
