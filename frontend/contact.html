<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Your Name</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="/frontend/js/components.js"></script>

</head>


<body>

    <div id="navbar"></div>


    <main>

        <!-- Contact introduction -->

        <section class="contact-intro">

            <p class="eyebrow">
                GET IN TOUCH
            </p>

            <h1>
                Let's work together.
            </h1>

            <p>
                Whether you have a question about my work,
                want to discuss a project, or simply want
                to say hello, I'd love to hear from you.
            </p>

        </section>


        <!-- Contact section -->

        <section class="contact-section">


            <!-- Form -->

            <div class="contact-form">

                <form id="contact-form">


                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input type="text" id="name" name="name" required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email" id="email" name="email" required>

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input type="text" id="subject" name="subject">

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea id="message" name="message" rows="7" required></textarea>

                    </div>


                    <button type="submit" class="submit-button">

                        Send message →

                    </button>


                </form>

            </div>


            <!-- Contact information -->

            <div class="contact-info">

                <div>

                    <p class="eyebrow">
                        EMAIL
                    </p>

                    <a href="mailto:jrein45@gmail.com">
                        jrein45@gmail.com
                    </a>

                </div>


                <div>

                    <p class="eyebrow">
                        INSTAGRAM
                    </p>

                    <a href="https://www.instagram.com/jrein98/">
                        @jrein98
                    </a>

                </div>


                <div>

                    <p class="eyebrow">
                        BASED IN
                    </p>

                    <p>
                        Switzerland
                    </p>

                </div>

            </div>


        </section>

    </main>
    
    <div id="footer"></div>
    
    </footer>

</body>

</html>
